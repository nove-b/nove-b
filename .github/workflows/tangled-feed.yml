name: Update README from Tangled feed

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://tangled.org/nove-b.dev/feed.atom"
          max_post_count: 10
          template: "$date - [$title]($url)"
          date_format: "yyyy-mm-dd"
